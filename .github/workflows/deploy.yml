# Автоматическая выкладка: после каждого git push в ветку main GitHub сам
# проверяет тесты, собирает сайт и публикует его на GitHub Pages.
name: Выкладка на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # кнопка «Run workflow» для ручного запуска

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
