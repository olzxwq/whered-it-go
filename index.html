<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F6EF" />
    <meta name="apple-mobile-web-app-title" content="Where'd It Go" />
    <title>Where'd It Go</title>
    <script>
      // Применяем выбранную тему до отрисовки, чтобы экран не «мигал» при загрузке
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
